name: CI

on:
  push:
    branches: [master, pre-release, 'release/**', 'feature/**']
  pull_request:

jobs:
  server-tests:
    name: API tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla
          POSTGRES_DB: tesla_pool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_pool_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://tesla:tesla@localhost:5432/tesla_pool_test

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    needs: [server-tests, client-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health and demo login
        run: |
          curl -fsS http://localhost:4000/api/health
          curl -fsS -H 'content-type: application/json' \
            -d '{"phone":"01711000002","password":"tesla1234"}' \
            http://localhost:4000/api/auth/login
      - if: always()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
